workflows:
  ios-workflow:
    name: UHRI iOS 26
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build iOS 26
        script: |
          xcodebuild -version
          xcodebuild -list -project "UHRI.xcodeproj"
          mkdir -p UHRI
          echo "<html></html>" > UHRI/index.html
          echo "<html></html>" > index.html
          xcodebuild build -project "UHRI.xcodeproj" -scheme "UHRI" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 
