workflows:
  UHRI-GREEN-FINAL-REAL:
    name: UHRI GREEN FINAL REAL
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: UHRI=14 New Key
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create missing files and Bundle ID
        script: |
          echo "<html><body>UHRI</body></html>" > index.html || true
          mkdir -p UHRI/Assets.xcassets/AppIcon.appiconset || true
          echo '{"info":{"author":"xcode","version":1}}' > UHRI/Assets.xcassets/Contents.json || true
          echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}]}' > UHRI/Assets.xcassets/AppIcon.appiconset/Contents.json || true
          # Try to create bundle ID com.uhri.green in Apple (ignore if already exists)
          app-store-connect bundle-ids list | grep com.uhri.green || app-store-connect bundle-ids create --identifier com.uhri.green --name "UHRI Green" --platform IOS || echo "bundle id create failed, may already exist"
      - name: Set up code signing with your UHRI=14 New Key
        script: |
          keychain initialize
          # This WILL create the profile now that bundle id exists
          app-store-connect fetch-signing-files "com.uhri.green" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build real GREEN IPA
        script: |
          # Use automatic signing to force Apple to make profile
          xcode-project build-ipa --project "UHRI.xcodeproj" --scheme "UHRI" --archive-flags "-allowProvisioningUpdates -allowProvisioningDeviceRegistration"
    artifacts:
      - build/ios/ipa/*.ipa
