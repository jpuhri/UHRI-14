workflows:
  UHRI-GREEN-FINAL-REAL:
    name: UHRI GREEN FINAL REAL
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build GREEN
        script: |
          echo "Fixing ALL file locations for Xcode"
          # Create index.html everywhere
          echo "<html></html>" > index.html
          mkdir -p UHRI && echo "<html></html>" > UHRI/index.html || true
          
          echo "Copying swift files to root"
          find . -name "*.swift" -type f -exec cp {} . \; 2>/dev/null || true
          find . -name "*.swift" -type f -exec cp {} UHRI/ \; 2>/dev/null || true
          
          echo "Copying plist files to root"
          find . -name "Info.plist" -type f | while read f; do cp "$f" ./Info.plist 2>/dev/null; cp "$f" ./UHRI/Info.plist 2>/dev/null; echo "Copied $f to root"; done
          find . -name "*.plist" -type f -exec cp {} . \; 2>/dev/null || true
          find . -name "*.plist" -type f -exec cp {} UHRI/ \; 2>/dev/null || true
          
          echo "Copying xcassets to root"
          find . -type d -name "*.xcassets" | head -n1 | while read d; do cp -R "$d" ./Assets.xcassets 2>/dev/null || true; echo "Copied $d"; done
          if [ -d "UHRI/Assets.xcassets" ]; then cp -R UHRI/Assets.xcassets ./Assets.xcassets 2>/dev/null; cp -R UHRI/Assets.xcassets ./UHRI.xcassets 2>/dev/null; fi
          cp -R ./Assets.xcassets UHRI/ 2>/dev/null || true
          
          echo "Final files at root:"
          ls -lh *.swift *.plist 2>/dev/null | head -n20
          ls -lh Assets.xcassets 2>/dev/null || true
          
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Building $PROJECT"
          xcodebuild -project "$PROJECT" -scheme UHRI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" || xcodebuild -project "$PROJECT" -target UHRI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
          
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n1)
          if [ -z "$APP" ]; then APP=$(find . -name "*.app" -type d | head -n1); fi
          echo "Found APP: $APP"
          du -sh "$APP" || true
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP" /tmp/Payload/
          cd /tmp && rm -f UHRI-GREEN-FINAL-2MB.ipa && zip -r UHRI-GREEN-FINAL-2MB.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp /tmp/UHRI-GREEN-FINAL-2MB.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
