workflows:
  UHRI-FINAL-AUTO-TESTFLIGHT:
    name: UHRI FINAL AUTO TESTFLIGHT
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: UHRI=14 New Key
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Find Xcode project
        script: |
          set -e
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "No xcodeproj found"
            exit 1
          fi
          echo "Found $PROJECT"
          
      - name: Set up keychain and fetch signing files
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "com.uhri.app" --type IOS_APP_STORE --create || app-store-connect fetch-signing-files --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build signed IPA for TestFlight
        script: |
          set -e
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          xcode-project build-ipa --project "$PROJECT" --scheme UHRI || xcode-project build-ipa --project "$PROJECT"
          
      - name: Verify IPA size
        script: |
          ls -lh build/ios/ipa/*.ipa || find . -name "*.ipa" -exec ls -lh {} \;
          
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Logs/gym/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - uhri@yahoo.com
        notify:
          success: true
          failure: true
