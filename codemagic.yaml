workflows:
  UHRI-FINAL-SUBMIT-TO-APPSTORE:
    name: UHRI FINAL SUBMIT TO APPSTORE
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    integrations:
      app_store_connect: UHRI-Key
    scripts:
      - name: Fix files (same 14.66 KB fix)
        script: |
          if [ ! -f "./Info.plist" ]; then
            cat > ./Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
          </dict></plist>
          PLIST
          fi
          mkdir -p UHRI && cp ./Info.plist ./UHRI/Info.plist 2>/dev/null || true
          [ -f "./ContentView.swift" ] || echo 'import SwiftUI; struct ContentView: View { var body: some View { VStack { Text("UHRI").font(.largeTitle); Text("14.66 KB SUCCESS") } } }' > ./ContentView.swift
          cp ./ContentView.swift ./UHRI/ 2>/dev/null || true
          [ -f "./UHRIApp.swift" ] || echo 'import SwiftUI; @main struct UHRIApp: App { var body: some Scene { WindowGroup { ContentView() } } }' > ./UHRIApp.swift
          cp ./UHRIApp.swift ./UHRI/ 2>/dev/null || true
          cp ./UHRIApp.swift ./UHRI.swift 2>/dev/null || true
          mkdir -p Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json || true
          echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json || true
          cp -R ./Assets.xcassets ./UHRI/ 2>/dev/null || true

      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_STORE --create || true
          keychain add-certificates || true
          xcode-project use-profiles || true

      - name: Build SIGNED IPA
        script: |
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          xcodebuild -project "$PROJECT" -scheme UHRI -configuration Release -sdk iphoneos -archivePath /tmp/UHRI.xcarchive archive
          cat > /tmp/ExportOptions.plist << 'EXP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EXP
          xcodebuild -exportArchive -archivePath /tmp/UHRI.xcarchive -exportPath /tmp/export -exportOptionsPlist /tmp/ExportOptions.plist
          IPA=$(find /tmp/export -name "*.ipa" | head -n1)
          echo "SIGNED IPA: $IPA"
          ls -lh "$IPA"
          mkdir -p build/ios/ipa
          cp "$IPA" build/ios/ipa/UHRI-FINAL-SIGNED.ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
