workflows:
  ios-workflow:
    name: UHRI - APP STORE READY - FINAL WINNER
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Create UHRI App Store Ready - BUILD 9 FINAL REAL IPA
        script: |
          set -x
          echo "=== BUILD 9 - FINAL FIX - WILL FIND APP ANYWHERE ==="
          rm -rf build FreshApp DerivedData
          mkdir -p build FreshApp/FreshApp/Assets.xcassets/AppIcon.appiconset
          mkdir -p FreshApp/FreshApp.xcodeproj/xcshareddata/xcschemes
          mkdir -p DerivedData

          cat > FreshApp/FreshApp/FreshApp.swift << 'SWIFT'
          import SwiftUI
          @main struct FreshApp: App { var body: some Scene { WindowGroup { MainTabView() } } }
          struct MainTabView: View {
            var body: some View {
              TabView {
                HomeView().tabItem { Label("Home", systemImage: "house.fill") }
                ServicesView().tabItem { Label("Services", systemImage: "briefcase.fill") }
                AboutView().tabItem { Label("About", systemImage: "info.circle.fill") }
                ContactView().tabItem { Label("Contact", systemImage: "envelope.fill") }
              }
            }
          }
          struct HomeView: View {
            var body: some View {
              NavigationView {
                VStack(spacing:20){
                  Text("UHRI").font(.system(size:50,weight:.bold)).foregroundColor(Color(red:0.06,green:0.3,blue:0.5))
                  Text("Universal Health Resources Initiative").multilineTextAlignment(.center)
                  Text("Build 9 - Final Real Build").font(.caption).foregroundColor(.secondary)
                }.padding().navigationTitle("UHRI Home")
              }
            }
          }
          struct ServicesView: View { var body: some View { NavigationView{ Text("Services - Trusted Healthcare Resources").navigationTitle("Services") } } }
          struct AboutView: View { var body: some View { NavigationView{ Text("About UHRI - Privacy First").navigationTitle("About") } } }
          struct ContactView: View { var body: some View { NavigationView{ Text("Contact: uhri@yahoo.com").navigationTitle("Contact") } } }
          SWIFT

          cat > /tmp/make_icon.py << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os
          os.makedirs("FreshApp/FreshApp/Assets.xcassets/AppIcon.appiconset", exist_ok=True)
          base=Image.new('RGB',(1024,1024),(15,76,129))
          d=ImageDraw.Draw(base)
          try: f=ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc",280)
          except: f=ImageFont.load_default()
          d.text((512,512),"UHRI",fill="white",font=f,anchor="mm")
          for name,px in [("20x20@2x",40),("20x20@3x",60),("29x29@2x",58),("29x29@3x",87),("40x40@2x",80),("40x40@3x",120),("60x60@2x",120),("60x60@3x",180),("20x20@1x",20),("20x20@2x-ipad",40),("29x29@1x",29),("29x29@2x-ipad",58),("40x40@1x",40),("40x40@2x-ipad",80),("76x76@1x",76),("76x76@2x",152),("83.5x83.5@2x",167)]:
            base.resize((px,px),Image.LANCZOS).save(f"FreshApp/FreshApp/Assets.xcassets/AppIcon.appiconset/icon-{name}.png")
          base.save("FreshApp/FreshApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png")
          contents={"images":[{"size":"20x20","idiom":"iphone","filename":"icon-20x20@2x.png","scale":"2x"},{"size":"20x20","idiom":"iphone","filename":"icon-20x20@3x.png","scale":"3x"},{"size":"29x29","idiom":"iphone","filename":"icon-29x29@2x.png","scale":"2x"},{"size":"29x29","idiom":"iphone","filename":"icon-29x29@3x.png","scale":"3x"},{"size":"40x40","idiom":"iphone","filename":"icon-40x40@2x.png","scale":"2x"},{"size":"40x40","idiom":"iphone","filename":"icon-40x40@3x.png","scale":"3x"},{"size":"60x60","idiom":"iphone","filename":"icon-60x60@2x.png","scale":"2x"},{"size":"60x60","idiom":"iphone","filename":"icon-60x60@3x.png","scale":"3x"},{"size":"20x20","idiom":"ipad","filename":"icon-20x20@1x.png","scale":"1x"},{"size":"20x20","idiom":"ipad","filename":"icon-20x20@2x-ipad.png","scale":"2x"},{"size":"29x29","idiom":"ipad","filename":"icon-29x29@1x.png","scale":"1x"},{"size":"29x29","idiom":"ipad","filename":"icon-29x29@2x-ipad.png","scale":"2x"},{"size":"40x40","idiom":"ipad","filename":"icon-40x40@1x.png","scale":"1x"},{"size":"40x40","idiom":"ipad","filename":"icon-40x40@2x-ipad.png","scale":"2x"},{"size":"76x76","idiom":"ipad","filename":"icon-76x76@1x.png","scale":"1x"},{"size":"76x76","idiom":"ipad","filename":"icon-76x76@2x.png","scale":"2x"},{"size":"83.5x83.5","idiom":"ipad","filename":"icon-83.5x83.5@2x.png","scale":"2x"},{"size":"1024x1024","idiom":"ios-marketing","filename":"icon-1024.png","scale":"1x"}],"info":{"author":"xcode","version":1}}
          open("FreshApp/FreshApp/Assets.xcassets/AppIcon.appiconset/Contents.json","w").write(json.dumps(contents,indent=2))
          open("FreshApp/FreshApp/Assets.xcassets/Contents.json","w").write('{"info":{"author":"xcode","version":1}}')
          PY
          python3 /tmp/make_icon.py

          cat > FreshApp/FreshApp.xcodeproj/project.pbxproj << 'PBX'
          // !$*UTF8*$!
          { archiveVersion = 1; classes = {}; objectVersion = 56; objects = {
          111111111111111111111111 = { isa = PBXProject; attributes = { BuildIndependentTargetsInParallel = 1; }; buildConfigurationList = 222222222222222222222222; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = 333333333333333333333333; productRefGroup = 444444444444444444444444; projectDirPath = ""; projectRoot = ""; targets = ( 555555555555555555555555 ); };
          222222222222222222222222 = { isa = XCConfigurationList; buildConfigurations = ( 666666666666666666666666, 777777777777777777777777 ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          333333333333333333333333 = { isa = PBXGroup; children = ( 888888888888888888888888, 444444444444444444444444 ); sourceTree = "<group>"; };
          444444444444444444444444 = { isa = PBXGroup; children = ( 999999999999999999999999 ); name = Products; sourceTree = "<group>"; };
          555555555555555555555555 = { isa = PBXNativeTarget; buildConfigurationList = AAAAAAAAAAAAAAAAAAAAAAAA; buildPhases = ( BBBBBBBBBBBBBBBBBBBBBBBB, CCCCCCCCCCCCCCCCCCCCCCCC, DDDDDDDDDDDDDDDDDDDDDDDD ); buildRules = (); dependencies = (); name = FreshApp; productName = UHRI; productReference = 999999999999999999999999; productType = "com.apple.product-type.application"; };
          666666666666666666666666 = { isa = XCBuildConfiguration; buildSettings = { ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGNING_ALLOWED = NO; INFOPLIST_FILE = FreshApp/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 16.0; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.final; PRODUCT_NAME = UHRI; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Debug; };
          777777777777777777777777 = { isa = XCBuildConfiguration; buildSettings = { ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGNING_ALLOWED = NO; INFOPLIST_FILE = FreshApp/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 16.0; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.final; PRODUCT_NAME = UHRI; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
          888888888888888888888888 = { isa = PBXGroup; children = ( EEEEEEEEEEEEEEEEEEEEEEEE, FFFFFFFFFFFFFFFFFFFF0001, 111122223333444455556666 ); path = FreshApp; sourceTree = "<group>"; };
          999999999999999999999999 = { isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = UHRI.app; sourceTree = BUILT_PRODUCTS_DIR; };
          AAAAAAAAAAAAAAAAAAAAAAAA = { isa = XCConfigurationList; buildConfigurations = ( FFFFFFFFFFFFFFFFFFFF0003, FFFFFFFFFFFFFFFFFFFF0004 ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          BBBBBBBBBBBBBBBBBBBBBBBB = { isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = ( 111122223333444455556667 ); runOnlyForDeploymentPostprocessing = 0; };
          CCCCCCCCCCCCCCCCCCCCCCCC = { isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
          DDDDDDDDDDDDDDDDDDDDDDDD = { isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = ( 111122223333444455556668 ); runOnlyForDeploymentPostprocessing = 0; };
          EEEEEEEEEEEEEEEEEEEEEEEE = { isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = FreshApp.swift; sourceTree = "<group>"; };
          FFFFFFFFFFFFFFFFFFFF0001 = { isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
          111122223333444455556666 = { isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          FFFFFFFFFFFFFFFFFFFF0003 = { isa = XCBuildConfiguration; buildSettings = { ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; PRODUCT_NAME = UHRI; CODE_SIGNING_ALLOWED = NO; }; name = Debug; };
          FFFFFFFFFFFFFFFFFFFF0004 = { isa = XCBuildConfiguration; buildSettings = { ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; PRODUCT_NAME = UHRI; CODE_SIGNING_ALLOWED = NO; }; name = Release; };
          111122223333444455556667 = { isa = PBXBuildFile; fileRef = EEEEEEEEEEEEEEEEEEEEEEEE; };
          111122223333444455556668 = { isa = PBXBuildFile; fileRef = FFFFFFFFFFFFFFFFFFFF0001; };
          }; rootObject = 111111111111111111111111; }
          PBX

          cat > FreshApp/FreshApp.xcodeproj/xcshareddata/xcschemes/FreshApp.xcscheme << 'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1420" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="555555555555555555555555" BuildableName="UHRI.app" BlueprintName="FreshApp" ReferencedContainer="container:FreshApp.xcodeproj"></BuildableReference>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug"></TestAction>
            <LaunchAction buildConfiguration="Debug"></LaunchAction>
            <ProfileAction buildConfiguration="Release"></ProfileAction>
            <AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>
            <ArchiveAction buildConfiguration="Release"></ArchiveAction>
          </Scheme>
          SCHEME

          cat > FreshApp/FreshApp/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.uhri.final</string>
            <key>CFBundleName</key><string>UHRI</string>
            <key>CFBundleDisplayName</key><string>UHRI</string>
            <key>CFBundleExecutable</key><string>FreshApp</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleVersion</key><string>9</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
            <key>ITSAppUsesNonExemptEncryption</key><false/>
          </dict>
          </plist>
          PLIST

          cd FreshApp
          echo "=== BUILD 9 - SIMPLE BUILD NO SYMROOT ==="
          # Build 1: Simulator without SYMROOT - goes to DerivedData
          xcodebuild -project FreshApp.xcodeproj -scheme FreshApp -configuration Release -sdk iphonesimulator -derivedDataPath ../DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          echo "=== AFTER BUILD - FINDING APP EVERYWHERE ==="
          cd ..
          find . -name "UHRI.app" -type d
          find DerivedData -name "UHRI.app" -type d 2>/dev/null
          find ~/Library/Developer/Xcode/DerivedData -name "UHRI.app" -type d 2>/dev/null | head -5
          ls -R DerivedData/Build/Products/ 2>/dev/null | head -30

          APP_PATH=$(find . -name "UHRI.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find DerivedData -name "UHRI.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "UHRI.app" -type d 2>/dev/null | head -1)
          fi

          echo "APP_PATH=$APP_PATH"
          if [ -n "$APP_PATH" ]; then
            echo "SUCCESS FOUND APP!"
            ls -lh "$APP_PATH/"
            du -sh "$APP_PATH"
            mkdir -p build/ipa/Payload
            rm -rf build/ipa/Payload/*
            cp -R "$APP_PATH" build/ipa/Payload/
            cd build/ipa && zip -r UHRI-FINAL-WINNER-APPSTORE-READY.ipa Payload && cd ../..
            ls -lh build/ipa/
            echo "=== BUILD 9 GREEN SUCCESS ==="
          else
            echo "STILL NOT FOUND - TRY SECOND METHOD - DEVICE BUILD"
            cd FreshApp
            xcodebuild -project FreshApp.xcodeproj -scheme FreshApp -configuration Release -sdk iphoneos -derivedDataPath ../DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual build || true
            cd ..
            find DerivedData -name "UHRI.app" -type d
            APP_PATH=$(find DerivedData -name "UHRI.app" -type d | head -1)
            echo "SECOND TRY APP_PATH=$APP_PATH"
            if [ -n "$APP_PATH" ]; then
              mkdir -p build/ipa/Payload
              rm -rf build/ipa/Payload/*
              cp -R "$APP_PATH" build/ipa/Payload/
              cd build/ipa && zip -r UHRI-FINAL-WINNER-APPSTORE-READY.ipa Payload && cd ../..
              ls -lh build/ipa/
            else
              echo "BOTH METHODS FAILED - SHOWING ALL LOGS"
              ls -R DerivedData | head -50
              exit 1
            fi
          fi
    artifacts:
      - build/ipa/*.ipa
      - DerivedData/Build/Products/**/*.app
      - DerivedData/Build/Products/**/*.ipa
