workflows:
  uhri-green-real:
    name: UHRI GREEN REAL 2MB
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Create Project
        script: |
          cat > UHRIApp.swift << 'SWIFT'
          import SwiftUI
          @main struct UHRIApp: App { var body: some Scene { WindowGroup { ContentView() } } }
          SWIFT
          cat > ContentView.swift << 'SWIFT'
          import SwiftUI
          struct ContentView: View { 
            var body: some View { 
              ZStack {
                Color.green.ignoresSafeArea()
                VStack {
                  Text("UHRI").font(.system(size: 80)).bold().foregroundColor(.white)
                  Text("GREEN BUILD 16").font(.title).foregroundColor(.white)
                  Text("REAL IPA").font(.title2).bold().foregroundColor(.yellow)
                }
              }
            } 
          }
          SWIFT
          mkdir -p Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          echo '{"images":[{"idiom":"iphone","scale":"2x","size":"20x20"},{"idiom":"iphone","scale":"3x","size":"20x20"},{"idiom":"iphone","scale":"2x","size":"29x29"},{"idiom":"iphone","scale":"3x","size":"29x29"},{"idiom":"iphone","scale":"2x","size":"40x40"},{"idiom":"iphone","scale":"3x","size":"40x40"},{"idiom":"iphone","scale":"2x","size":"60x60"},{"idiom":"iphone","scale":"3x","size":"60x60"}]}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          cat > Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.uhri.app</string>
          <key>CFBundleName</key><string>UHRI</string>
          <key>CFBundleExecutable</key><string>UHRI</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>16</string>
          <key>LSRequiresIPhoneOS</key><true/>
          </dict></plist>
          PLIST
          mkdir -p UHRI.xcodeproj
          cat > UHRI.xcodeproj/project.pbxproj << 'PBX'
          // !$*UTF8*$!
          { archiveVersion = 1; classes = {}; objectVersion = 56; objects = {
          A1 = {isa = PBXBuildFile; fileRef = F1; }; A2 = {isa = PBXBuildFile; fileRef = F2; }; A3 = {isa = PBXBuildFile; fileRef = F3; };
          F0 = {isa = PBXFileReference; lastKnownFileType = wrapper.application; path = UHRI.app; sourceTree = BUILT_PRODUCTS_DIR; };
          F1 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = UHRIApp.swift; sourceTree = "<group>"; };
          F2 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
          F3 = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
          F4 = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          BF = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
          D0 = {isa = PBXGroup; children = (F1, F2, F3, F4); path = "."; sourceTree = "<group>"; };
          D1 = {isa = PBXGroup; children = (D0, D2); sourceTree = "<group>"; };
          D2 = {isa = PBXGroup; children = (F0); name = Products; sourceTree = "<group>"; };
          T0 = {isa = PBXNativeTarget; buildConfigurationList = C1; buildPhases = (S0, BF, R0); buildRules = (); dependencies = (); name = UHRI; productName = UHRI; productReference = F0; productType = "com.apple.product-type.application"; };
          P0 = {isa = PBXProject; attributes = {BuildIndependentTargetsInParallel = 1; LastSwiftUpdateCheck = 1500; TargetAttributes = { T0 = { CreatedOnToolsVersion = 15.0; }; }; }; buildConfigurationList = C0; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = D1; productRefGroup = D2; projectDirPath = ""; projectRoot = ""; targets = (T0); };
          R0 = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (A3); runOnlyForDeploymentPostprocessing = 0; };
          S0 = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A1, A2); runOnlyForDeploymentPostprocessing = 0; };
          C0 = {isa = XCConfigurationList; buildConfigurations = (C01, C02); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          C1 = {isa = XCConfigurationList; buildConfigurations = (C11, C12); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          C01 = {isa = XCBuildConfiguration; buildSettings = {ALWAYS_SEARCH_USER_PATHS = NO; CODE_SIGNING_ALLOWED = NO; }; name = Debug; };
          C02 = {isa = XCBuildConfiguration; buildSettings = {ALWAYS_SEARCH_USER_PATHS = NO; CODE_SIGNING_ALLOWED = NO; }; name = Release; };
          C11 = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGNING_ALLOWED = NO; INFOPLIST_FILE = Info.plist; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.app; PRODUCT_NAME = UHRI; SWIFT_VERSION = 5.0; }; name = Debug; };
          C12 = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGNING_ALLOWED = NO; INFOPLIST_FILE = Info.plist; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.app; PRODUCT_NAME = UHRI; SWIFT_VERSION = 5.0; }; name = Release; };
          }; rootObject = P0; }
          PBX
      - name: Build REAL IPA
        script: |
          echo "Building UHRI..."
          xcodebuild -project UHRI.xcodeproj -target UHRI -configuration Release -sdk iphoneos -derivedDataPath build SYMROOT=build/Build/Products CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          echo "Build finished, searching for .app..."
          find build -name "UHRI.app" -type d
          APP_PATH=$(find build -name "UHRI.app" -type d | head -1)
          echo "Found APP at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r -y UHRI-GREEN-BUILD-16-REAL.ipa Payload
          ls -lh *.ipa
          echo "SUCCESS - REAL IPA SIZE:"
          du -h *.ipa
    artifacts:
      - "build/ipa/*.ipa"
