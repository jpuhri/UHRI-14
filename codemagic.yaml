          echo "Fixed project - path = empty, not .."
          ls -lh
          cat UHRI.xcodeproj/project.pbxproj | grep -A2 "children"
      - name: Build FIXED PROJECT - WILL BE REAL 2MB IPA
        script: |
          set -e
          echo "Building with fixed paths..."
          xcodebuild -project UHRI.xcodeproj -scheme UHRI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath /tmp/derived BUILD_DIR=/tmp/build | tail -20
          echo "=== Find app ==="
          find /tmp/build -name "UHRI.app" -type d -exec ls -lh {} \; 2>/dev/null || true
          APP=$(find /tmp/build -name "UHRI.app" -type d | head -1)
          if [ -z "$APP" ]; then APP=$(find /tmp/derived -name "UHRI.app" -type d | head -1); fi
          echo "App found at: $APP"
          ls -lh "$APP" || true
          du -sh "$APP"
          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/*
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y UHRI-FIXED-GREEN.ipa Payload
          ls -lh *.ipa
          du -h *.ipa
          echo "=== SUCCESS - SHOULD BE 2-3 MB, NOT 328 BYTES ==="
    artifacts:
      - build/ios/ipa/*.ipa
