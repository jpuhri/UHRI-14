workflows:
  ios-workflow:
    name: UHRI iOS 26
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build with iOS 26 SDK
        script: |
          xcode-project build-ipa --project "UHRI.xcodeproj" --scheme "UHRI"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
