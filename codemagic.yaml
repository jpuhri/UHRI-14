workflows:
  uhri-app-store-signed:
    name: UHRI - APP STORE READY - FINAL WINNER SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.uhri.app"
        XCODE_PROJECT: "UHRI.xcodeproj"
        XCODE_SCHEME: "UHRI"
    scripts:
      - name: CREATE MISSING FILES + FORCE AUTOMATIC
        script: |
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack { Text("UHRI").font(.largeTitle).bold(); Text("com.uhri.app") }
              }
          }
          EOF
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          EOF
          echo '<html><body>UHRI</body></html>' > index.html
          echo "=== Forcing Automatic Signing ==="
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' UHRI.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_STYLE=Manual/CODE_SIGN_STYLE=Automatic/g' UHRI.xcodeproj/project.pbxproj || true
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER.*;//g' UHRI.xcodeproj/project.pbxproj || true
          sed -i '' 's/PROVISIONING_PROFILE =.*;//g' UHRI.xcodeproj/project.pbxproj || true
          grep CODE_SIGN_STYLE UHRI.xcodeproj/project.pbxproj | head -5
      - name: Generate private key + Fetch signing files WITH KEY
        script: |
          echo "Generating private key for certificate..."
          openssl genrsa -out /tmp/cert_private.key 2048
          echo "Private key generated at /tmp/cert_private.key"
          ls -lh /tmp/cert_private.key
          echo "=== Fetching signing files WITH private key ==="
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_STORE --create --certificate-key @file:/tmp/cert_private.key || true
          echo "=== After first fetch, trying again ==="
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_STORE --certificate-key @file:/tmp/cert_private.key || true
          echo "=== Profiles ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          find ~/Library -name "*.mobileprovision" | head -20 || true
          echo "=== Keychain ==="
          keychain initialize
          keychain add-certificates
          echo "=== Try use-profiles ==="
          xcode-project use-profiles || echo "use-profiles failed, keeping Automatic"
      - name: Build IPA with Automatic Signing
        script: |
          echo "Building with Automatic signing..."
          # Try simple build-ipa first
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || true
          echo "=== Checking IPA ==="
          ls -lh build/ios/ipa/ || true
          # If that failed, try xcodebuild archive with automatic
          if [ ! -f build/ios/ipa/*.ipa ]; then
            echo "First build failed, trying xcodebuild archive with automatic..."
            xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release archive -archivePath /tmp/UHRI.xcarchive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="" -allowProvisioningUpdates -allowProvisioningDeviceRegistration || true
            echo "=== Archive ==="
            ls -lh /tmp/UHRI.xcarchive/ || true
            cat > /tmp/export.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath /tmp/UHRI.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/export.plist -allowProvisioningUpdates || true
            ls -lh build/ios/ipa/ || true
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
