workflows:
  UHRI-GREEN-FINAL-REAL:
    name: UHRI GREEN FINAL REAL
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.uhri.green
    scripts:
      - name: Create missing files
        script: |
          echo "<html><body>UHRI</body></html>" > index.html || true
          mkdir -p UHRI/Assets.xcassets/AppIcon.appiconset || true
          echo '{"info":{"author":"xcode","version":1}}' > UHRI/Assets.xcassets/Contents.json || true
          echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}]}' > UHRI/Assets.xcassets/AppIcon.appiconset/Contents.json || true
      - name: Build real GREEN IPA with automatic signing
        script: |
          xcode-project build-ipa --project "UHRI.xcodeproj" --scheme "UHRI" --verbose
    artifacts:
      - build/ios/ipa/*.ipa
