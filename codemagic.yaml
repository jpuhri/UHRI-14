workflows:
  UHRI FINAL SIGNED:
    name: UHRI FINAL SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: UHRis14 New Key
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.uhri14.app"
        XCODE_WORKSPACE: "URLL.xcworkspace"
        XCODE_SCHEME: "URLL"
    scripts:
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up provisioning
        script: |
          xcode-project use-profiles
      - name: Install pods
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace="$XCODE_WORKSPACE" --scheme="$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        api_key: UHRis14 New Key
        submit_to_testflight: true
