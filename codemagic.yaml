workflows:
  uhri-app-store-signed:
    name: UHRI - APP STORE READY - FINAL WINNER SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.uhri.app"
        XCODE_PROJECT: "UHRI.xcodeproj"
        XCODE_SCHEME: "UHRI"
    scripts:
      - name: CREATE MISSING FILES - REAL BUNDLE com.uhri.app
        script: |
          echo "=== Bundle ID is com.uhri.app - YOUR REAL ID ==="
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 20) {
                      Text("UHRI")
                          .font(.system(size: 60, weight: .bold))
                          .foregroundColor(.blue)
                      Text("Home Inspection")
                          .font(.title2)
                      Text("✅ App Store Ready")
                          .foregroundColor(.green)
                      Text("com.uhri.app")
                          .font(.caption)
                      Spacer()
                  }.padding()
              }
          }
          EOF
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          EOF
          echo '<html><body><h1>UHRI com.uhri.app</h1></body></html>' > index.html
          ls -lh ContentView.swift UHRIApp.swift
          echo "Project bundle:"
          grep PRODUCT_BUNDLE_IDENTIFIER UHRI.xcodeproj/project.pbxproj | head -1
      - name: Set up Apple signing for com.uhri.app - CREATE BOTH PROFILES
        script: |
          echo "Setting up signing for com.uhri.app - API Key H9RDSPQQ7F"
          echo "=== Fetching APP STORE profile ==="
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_STORE --create || echo "App Store fetch tried"
          echo "=== Fetching DEVELOPMENT profile (needed for archive) ==="
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_DEVELOPMENT --create || echo "Dev fetch tried"
          echo "=== Fetching all profiles ==="
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create || true
          app-store-connect fetch-signing-files --type IOS_APP_DEVELOPMENT --create || true
          echo "=== Profiles on disk ==="
          find ~/Library -name "*.mobileprovision" 2>/dev/null | head -20 || true
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true
          echo "=== Keychain ==="
          keychain initialize
          keychain add-certificates
          echo "=== Applying profiles to Xcode ==="
          xcode-project use-profiles
          echo "Done"
      - name: Build SIGNED IPA for com.uhri.app
        script: |
          echo "Building IPA for com.uhri.app with allowProvisioningUpdates..."
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --archive-flags "-allowProvisioningUpdates -allowProvisioningDeviceRegistration"
          echo "=== IPA ==="
          ls -lh build/ios/ipa/
          find build -name "*.ipa" -ls || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-workflow:
    name: BUILD 10 - DO NOT USE - OLD
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: DO NOT USE
        script: |
          echo "Use SIGNED workflow for com.uhri.app"
          exit 1
