workflows:
  UHRI-FINAL-SIGNED:
    name: UHRI FINAL SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: UHRIs14 New Key
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create missing files
        script: |
          echo "Fixing missing files..."
          echo "<html><body>UHRI</body></html>" > index.html || true
          mkdir -p UHRI/Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > UHRI/Assets.xcassets/Contents.json
          echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}]}' > UHRI/Assets.xcassets/AppIcon.appiconset/Contents.json
      - name: Set up code signing with NEW GREEN KEY DYD5XLEU7K09
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.uhri.green --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed GREEN IPA
        script: |
          xcode-project build-ipa --project "UHRI.xcodeproj" --scheme "UHRI"
    artifacts:
      - build/ios/ipa/*.ipa
