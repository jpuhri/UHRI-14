workflows:
  uhri-app-store-signed:
    name: UHRI - APP STORE READY - FINAL WINNER SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "UHRI.xcodeproj"
        XCODE_SCHEME: "UHRI"
    scripts:
      - name: CREATE MISSING SWIFT FILES + DETECT REAL BUNDLE ID
        script: |
          echo "=== Creating missing files ==="
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 20) {
                      Text("UHRI")
                          .font(.system(size: 60, weight: .bold))
                          .foregroundColor(.blue)
                      Text("Home Inspection")
                          .font(.title2)
                      Text("✅ App Store Ready")
                          .foregroundColor(.green)
                      Text("Professional Home Inspection")
                          .multilineTextAlignment(.center)
                          .padding()
                      Spacer()
                  }.padding()
              }
          }
          EOF
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          EOF
          echo '<html><body><h1>UHRI</h1></body></html>' > index.html
          echo "=== Detecting REAL Bundle ID from Xcode project ==="
          cat UHRI.xcodeproj/project.pbxproj | grep -A2 PRODUCT_BUNDLE_IDENTIFIER | head -20
          REAL_BUNDLE=$(grep PRODUCT_BUNDLE_IDENTIFIER UHRI.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *//' | sed 's/;.*//' | tr -d '" ' | tr -d '\n')
          echo "Detected bundle: $REAL_BUNDLE"
          if [ -z "$REAL_BUNDLE" ] || [ "$REAL_BUNDLE" = "" ]; then
            REAL_BUNDLE="com.uhri.homeinspection"
            echo "Using fallback: $REAL_BUNDLE"
          fi
          echo "BUNDLE_ID=$REAL_BUNDLE" >> $CM_ENV
          echo "Real bundle is: $REAL_BUNDLE"
      - name: Set up Apple signing with AUTO-DETECTED Bundle
        script: |
          echo "Bundle ID is: $BUNDLE_ID"
          echo "Fetching signing files for $BUNDLE_ID"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true
          echo "Also fetching all IOS_APP_STORE profiles..."
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create || true
          echo "Profiles:"
          ls -R ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true
          keychain initialize
          keychain add-certificates
          echo "Applying profiles to project..."
          xcode-project use-profiles || true
          echo "Current signing settings:"
          xcode-project detect-bundle-id || true
      - name: Build SIGNED IPA - AUTOMATIC SIGNING ALLOWED
        script: |
          echo "Building with automatic signing..."
          # Try Codemagic build-ipa with provisioning updates allowed
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --archive-flags "-allowProvisioningUpdates -allowProvisioningDeviceRegistration" || true
          echo "If that failed, try direct xcodebuild with automatic..."
          if [ ! -f build/ios/ipa/*.ipa ]; then
            xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release archive -archivePath /tmp/UHRI.xcarchive CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates || true
            xcodebuild -exportArchive -archivePath /tmp/UHRI.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/export.plist 2>/dev/null || true
            # Create export.plist
            cat > /tmp/export.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath /tmp/UHRI.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/export.plist || true
          fi
          ls -lh build/ios/ipa/ || true
          find build -name "*.ipa" -exec ls -lh {} \; || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/ipa/*.plist

  ios-workflow:
    name: BUILD 10 - DO NOT USE
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: DO NOT USE
        script: |
          echo "Use SIGNED workflow"
          exit 1
