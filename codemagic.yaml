workflows:
  uhri-app-store-signed:
    name: UHRI - APP STORE READY - FINAL WINNER SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.uhri.app"
        XCODE_PROJECT: "UHRI.xcodeproj"
        XCODE_SCHEME: "UHRI"
    scripts:
      - name: CREATE MISSING FILES
        script: |
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 20) {
                      Text("UHRI").font(.system(size: 60, weight: .bold)).foregroundColor(.blue)
                      Text("Home Inspection").font(.title2)
                      Text("App Store Ready").foregroundColor(.green)
                      Spacer()
                  }.padding()
              }
          }
          EOF
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          EOF
          echo '<html><body>UHRI</body></html>' > index.html
          echo "Files created, bundle is com.uhri.app"
      - name: CREATE Bundle ID com.uhri.app if missing
        script: |
          echo "Creating Bundle ID com.uhri.app in Apple Developer Portal..."
          app-store-connect bundle-ids create --identifier com.uhri.app --name UHRI --platform IOS || echo "Bundle ID already exists or creation attempted"
          echo "Listing bundle IDs:"
          app-store-connect bundle-ids list --identifier com.uhri.app || true
      - name: Fetch signing files for com.uhri.app - NOW IT WILL WORK
        script: |
          echo "Fetching APP STORE profile for com.uhri.app..."
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_STORE --create
          echo "Fetching DEVELOPMENT profile..."
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_DEVELOPMENT --create || true
          echo "Profiles saved:"
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null | head -20
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build SIGNED IPA for com.uhri.app
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --archive-flags "-allowProvisioningUpdates"
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-workflow:
    name: BUILD 10 - DO NOT USE
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: DO NOT USE
        script: |
          echo "Use SIGNED workflow"
          exit 1
