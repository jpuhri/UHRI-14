workflows:
  UHRI-GREEN-FINAL-REAL:
    name: UHRI GREEN FINAL REAL
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          set -e
          set -x
          keychain initialize
          app-store-connect fetch-signing-files "com.uhri.green" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --warn-only
          echo "=== PROFILES APPLIED ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
      - name: Build real IPA
        script: |
          set -x
          xcode-project build-ipa --project "UHRI.xcodeproj" --scheme "UHRI" --verbose
    artifacts:
      - build/ios/ipa/*.ipa
