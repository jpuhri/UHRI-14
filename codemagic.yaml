workflows:
  UHRI FINAL SIGNED:
    name: UHRI FINAL SIGNED
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: UHRis14 New Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.uhri14.app
      vars:
        XCODE_WORKSPACE: "URLL.xcworkspace"
        XCODE_SCHEME: "URLL"
        BUNDLE_ID: "com.uhri14.app"
      xcode: latest
      cocoapods: default
    triggering:
      manual: true
    scripts:
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Set up keychain and add certs
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Install Pods
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace="$XCODE_WORKSPACE" --scheme="$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: UHRis14 New Key
        submit_to_testflight: true
