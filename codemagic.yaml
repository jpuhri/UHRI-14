workflows:
  uhri-green-test:
    name: UHRI - ULTIMATE GREEN - NEW PROJECT
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: DELETE BROKEN PROJECT AND CREATE NEW ONE
        script: |
          rm -rf UHRI.xcodeproj UHRI.xcworkspace Pods Podfile.lock
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          EOF
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 20) {
                      Text("UHRI").font(.system(size: 60, weight: .bold)).foregroundColor(.blue)
                      Text("Home Inspection").font(.title2)
                      Text("FINAL GREEN BUILD!").font(.title).bold().foregroundColor(.green)
                      Text("Version 1.0").font(.caption)
                  }.padding()
              }
          }
          EOF
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cat > Assets.xcassets/Contents.json << 'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON'
          {"images":[{"idiom":"iphone","scale":"2x","size":"20x20"},{"idiom":"iphone","scale":"3x","size":"20x20"},{"idiom":"iphone","scale":"2x","size":"29x29"},{"idiom":"iphone","scale":"3x","size":"29x29"},{"idiom":"iphone","scale":"2x","size":"40x40"},{"idiom":"iphone","scale":"3x","size":"40x40"},{"idiom":"iphone","scale":"2x","size":"60x60"},{"idiom":"iphone","scale":"3x","size":"60x60"},{"idiom":"ios-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.uhri.app</string>
            <key>CFBundleName</key><string>UHRI</string>
            <key>CFBundleDisplayName</key><string>UHRI</string>
            <key>CFBundleExecutable</key><string>UHRI</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
          </dict>
          </plist>
          PLIST
          cat > LaunchScreen.storyboard << 'LS'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701"><scenes><scene sceneID="01"><objects><viewController id="02" sceneMemberID="viewController"><view key="view" contentMode="scaleToFill" id="03"><color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/></view></viewController><placeholder placeholderIdentifier="IBFirstResponder" id="04" userLabel="First Responder" sceneMemberID="firstResponder"/></objects></scene></scenes></document>
          LS
          mkdir -p UHRI.xcodeproj
          cat > UHRI.xcodeproj/project.pbxproj << 'PBX'
