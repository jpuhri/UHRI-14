workflows:
  uhri-app-store-signed:
    name: UHRI - APP STORE READY - FINAL WINNER SIGNED
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.uhri.app"
        XCODE_PROJECT: "UHRI.xcodeproj"
        XCODE_SCHEME: "UHRI"
    scripts:
      - name: CREATE MISSING FILES
        script: |
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack {
                      Text("UHRI").font(.largeTitle).bold()
                      Text("Home Inspection")
                      Text("com.uhri.app").font(.caption)
                  }
              }
          }
          EOF
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          EOF
          echo '<html><body>UHRI</body></html>' > index.html
          echo "Files created"
      - name: CREATE Bundle ID com.uhri.app
        script: |
          echo "Attempting to create Bundle ID com.uhri.app..."
          app-store-connect bundle-ids create --identifier com.uhri.app --name UHRI --platform IOS || echo "Bundle ID may already exist"
          app-store-connect bundle-ids list | grep com.uhri || true
      - name: Fetch signing files SIMPLE
        script: |
          echo "Fetching profile for com.uhri.app..."
          app-store-connect fetch-signing-files com.uhri.app --type IOS_APP_STORE --create
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build SIGNED IPA SIMPLE
        script: |
          echo "Building IPA - SIMPLE COMMAND NO FLAGS..."
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
