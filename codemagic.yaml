workflows:
  uhri-green-test:
    name: UHRI - GREEN TEST - WILL SUCCEED
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "UHRI.xcodeproj"
        XCODE_SCHEME: "UHRI"
    scripts:
      - name: CREATE ALL MISSING FILES
        script: |
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 20) {
                      Text("UHRI").font(.largeTitle).bold()
                      Text("Home Inspection").font(.title2)
                      Text("GREEN BUILD!").foregroundColor(.green).bold().font(.largeTitle)
                      Text("com.uhri.app").font(.caption)
                  }
              }
          }
          EOF
          cat > UHRIApp.swift << 'EOF'
          import SwiftUI
          @main
          struct UHRIApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          EOF
          echo '<html><body>UHRI GREEN TEST</body></html>' > index.html
          cat > Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>UHRI</string>
            <key>CFBundleExecutable</key><string>UHRI</string>
            <key>CFBundleIdentifier</key><string>com.uhri.app</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>UHRI</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>armv7</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          PLIST
          echo "Info.plist created at $(pwd)/Info.plist"
          cat Info.plist
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cat > Assets.xcassets/Contents.json << 'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON'
          {
            "images": [
              {"idiom":"iphone","scale":"2x","size":"20x20"},
              {"idiom":"iphone","scale":"3x","size":"20x20"},
              {"idiom":"iphone","scale":"2x","size":"29x29"},
              {"idiom":"iphone","scale":"3x","size":"29x29"},
              {"idiom":"iphone","scale":"2x","size":"40x40"},
              {"idiom":"iphone","scale":"3x","size":"40x40"},
              {"idiom":"iphone","scale":"2x","size":"60x60"},
              {"idiom":"iphone","scale":"3x","size":"60x60"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSON
          # Check project.pbxproj for INFOPLIST_FILE reference
          grep -n INFOPLIST_FILE UHRI.xcodeproj/project.pbxproj | head -5 || echo "No INFOPLIST_FILE found"
      - name: Build UNSIGNED IPA - WILL BE GREEN
        script: |
          echo "Building with Info.plist now present"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath /tmp/derived BUILD_DIR=/tmp/build || true
          echo "=== Searching for app ==="
          find /tmp -name "UHRI.app" -type d 2>/dev/null | head -10
          mkdir -p build/ios/ipa/Payload
          APP=$(find /tmp -name "UHRI.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found app at $APP"
            cp -R "$APP" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r UHRI-unsigned-green.ipa Payload
            ls -lh *.ipa
            echo "=== GREEN BUILD SUCCESS ==="
          else
            echo "App not found - listing build dir"
            ls -R /tmp/build/ 2>&1 | head -50
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
