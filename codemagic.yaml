workflows:
  uhri-green-test:
    name: UHRI - ULTIMATE GREEN - NEW PROJECT
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: CREATE PROJECT
        script: |
          rm -rf UHRI.xcodeproj
          cat > UHRIApp.swift << 'SWIFT'
          import SwiftUI
          @main struct UHRIApp: App { var body: some Scene { WindowGroup { ContentView() } } }
          SWIFT
          cat > ContentView.swift << 'SWIFT'
          import SwiftUI
          struct ContentView: View { var body: some View { Text("UHRI GREEN!").font(.largeTitle).bold().foregroundColor(.green).padding() } }
          SWIFT
          mkdir -p Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          echo '{"images":[{"idiom":"iphone","scale":"2x","size":"20x20"},{"idiom":"iphone","scale":"3x","size":"20x20"},{"idiom":"iphone","scale":"2x","size":"29x29"},{"idiom":"iphone","scale":"3x","size":"29x29"},{"idiom":"iphone","scale":"2x","size":"40x40"},{"idiom":"iphone","scale":"3x","size":"40x40"},{"idiom":"iphone","scale":"2x","size":"60x60"},{"idiom":"iphone","scale":"3x","size":"60x60"},{"idiom":"ios-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          cat > Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.uhri.app</string>
          <key>CFBundleName</key><string>UHRI</string>
          <key>CFBundleExecutable</key><string>UHRI</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSRequiresIPhoneOS</key><true/>
          </dict></plist>
          PLIST
          mkdir -p UHRI.xcodeproj
          cat > UHRI.xcodeproj/project.pbxproj << 'PBX'
          // !$*UTF8*$!
          { archiveVersion = 1; classes = {}; objectVersion = 56; objects = {
          A1 = {isa = PBXBuildFile; fileRef = F1; }; A2 = {isa = PBXBuildFile; fileRef = F2; }; A3 = {isa = PBXBuildFile; fileRef = F3; };
          F0 = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = UHRI.app; sourceTree = BUILT_PRODUCTS_DIR; };
          F1 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = UHRIApp.swift; sourceTree = "<group>"; };
          F2 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
          F3 = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
          F5 = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          BF = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
          G0 = {isa = PBXGroup; children = (F1, F2, F3, F5); path = ""; sourceTree = "<group>"; };
          G1 = {isa = PBXGroup; children = (G0, G2); sourceTree = "<group>"; };
          G2 = {isa = PBXGroup; children = (F0); name = Products; sourceTree = "<group>"; };
          T0 = {isa = PBXNativeTarget; buildConfigurationList = C1; buildPhases = (S0, BF, R0); buildRules = (); dependencies = (); name = UHRI; productName = UHRI; productReference = F0; productType = "com.apple.product-type.application"; };
          P0 = {isa = PBXProject; attributes = {BuildIndependentTargetsInParallel = 1; LastSwiftUpdateCheck = 1500; ORGANIZATIONNAME = UHRI; TargetAttributes = {T0 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = C0; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = G1; productRefGroup = G2; projectDirPath = ""; projectRoot = ""; targets = (T0); };
          R0 = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (A3); runOnlyForDeploymentPostprocessing = 0; };
          S0 = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A1, A2); runOnlyForDeploymentPostprocessing = 0; };
          CB1 = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; INFOPLIST_FILE = Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 15.0; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.app; PRODUCT_NAME = UHRI; SWIFT_VERSION = 5.0; }; name = Debug; };
          CB2 = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; INFOPLIST_FILE = Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 15.0; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.app; PRODUCT_NAME = UHRI; SWIFT_VERSION = 5.0; }; name = Release; };
          CP1 = {isa = XCBuildConfiguration; buildSettings = {SDKROOT = iphoneos; }; name = Debug; };
          CP2 = {isa = XCBuildConfiguration; buildSettings = {SDKROOT = iphoneos; }; name = Release; };
          C0 = {isa = XCConfigurationList; buildConfigurations = (CP1, CP2); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          C1 = {isa = XCConfigurationList; buildConfigurations = (CB1, CB2); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          }; rootObject = P0; }
          PBX
      - name: BUILD - FIXED NO DERIVEDDATAPATH
        script: |
          xcodebuild -project UHRI.xcodeproj -target UHRI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -50
          APP=$(find . -name "UHRI.app" -type d | head -1)
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode/DerivedData -name "UHRI.app" -type d | head -1); fi
          echo "APP: $APP"
          ls -lhR "$APP" | head -100
          du -sh "$APP"
          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/*
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r UHRI-REAL-2MB.ipa Payload && ls -lh *.ipa
    artifacts:
      - build/ios/ipa/*.ipa
