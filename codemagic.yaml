workflows:
  UHRI-GREEN-FINAL-REAL:
    name: UHRI GREEN FINAL REAL
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build without signing (test compile)
        script: |
          set -x
          echo "Testing if UHRI.xcodeproj compiles..."
          xcodebuild -project "UHRI.xcodeproj" -scheme "UHRI" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -50
          echo "=== BUILD TEST PASSED! Your app code is good! ==="
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.log"
