workflows:
  UHRI-GREEN-FINAL-REAL:
    name: UHRI GREEN FINAL REAL
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build GREEN
        script: |
          echo "Fixing file locations for Xcode"
          ls -la
          ls -la UHRI/ || true
          echo "<html><body>UHRI</body></html>" > index.html
          echo "<html><body>UHRI</body></html>" > UHRI/index.html 2>/dev/null || true
          
          if [ -d "UHRI/Assets.xcassets" ]; then cp -R UHRI/Assets.xcassets ./Assets.xcassets 2>/dev/null || true; cp -R UHRI/Assets.xcassets ./UHRI.xcassets 2>/dev/null || true; fi
          if [ -f "UHRI/ContentView.swift" ]; then cp UHRI/ContentView.swift ./ContentView.swift 2>/dev/null || true; fi
          if [ -f "UHRI/UHRIApp.swift" ]; then cp UHRI/UHRIApp.swift ./UHRIApp.swift 2>/dev/null; cp UHRI/UHRIApp.swift ./UHRI.swift 2>/dev/null || true; fi
          find UHRI -name "*.swift" -exec cp {} . \; 2>/dev/null || true
          find . -maxdepth 2 -name "*.swift" -exec cp {} UHRI/ \; 2>/dev/null || true
          ls -la *.swift 2>/dev/null; ls -la *.xcassets 2>/dev/null || true
          
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Building $PROJECT"
          xcodebuild -project "$PROJECT" -scheme UHRI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -allowProvisioningUpdates -quiet || xcodebuild -project "$PROJECT" -target UHRI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -quiet || true
          
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n1)
          if [ -z "$APP" ]; then APP=$(find . -name "*.app" -type d | head -n1); fi
          echo "APP $APP"
          du -sh "$APP" || true
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP" /tmp/Payload/
          cd /tmp && rm -f UHRI-GREEN-FINAL-2MB.ipa && zip -r UHRI-GREEN-FINAL-2MB.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp /tmp/UHRI-GREEN-FINAL-2MB.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
