workflows:
  ios-workflow:
    name: UHRI FINAL WINNER
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Create and Build Clean App
        script: |
          set -x
          echo "=== FINAL WINNER BUILD ==="
          rm -rf build FreshApp
          mkdir -p build
          mkdir -p FreshApp/FreshApp
          
          # Create Swift files - ULTRA SIMPLE
          cat > FreshApp/FreshApp/FreshApp.swift << 'SWIFT'
          import SwiftUI
          @main
          struct FreshApp: App {
              var body: some Scene {
                  WindowGroup {
                      Text("UHRI - BUILD SUCCESS!").font(.largeTitle).bold().multilineTextAlignment(.center).padding()
                  }
              }
          }
          SWIFT
          
          # NO Assets.xcassets to avoid CompileAssetCatalog failure!
          # Create simple project without asset catalog
          mkdir -p FreshApp/FreshApp.xcodeproj
          cat > FreshApp/FreshApp.xcodeproj/project.pbxproj << 'PBX'
          // !$*UTF8*$!
          { archiveVersion = 1; classes = {}; objectVersion = 56; objects = {
          111111111111111111111111 /* Project */ = { isa = PBXProject; attributes = { BuildIndependentTargetsInParallel = 1; LastSwiftUpdateCheck = 1420; }; buildConfigurationList = 222222222222222222222222; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = 333333333333333333333333; productRefGroup = 444444444444444444444444; projectDirPath = ""; projectRoot = ""; targets = ( 555555555555555555555555 ); };
          222222222222222222222222 = { isa = XCConfigurationList; buildConfigurations = ( 666666666666666666666666, 777777777777777777777777 ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          333333333333333333333333 = { isa = PBXGroup; children = ( 888888888888888888888888, 444444444444444444444444 ); sourceTree = "<group>"; };
          444444444444444444444444 = { isa = PBXGroup; children = ( 999999999999999999999999 ); name = Products; sourceTree = "<group>"; };
          555555555555555555555555 = { isa = PBXNativeTarget; buildConfigurationList = AAAAAAAAAAAAAAAAAAAAAAAA; buildPhases = ( BBBBBBBBBBBBBBBBBBBBBBBB, CCCCCCCCCCCCCCCCCCCCCCCC ); buildRules = (); dependencies = (); name = FreshApp; productName = FreshApp; productReference = 999999999999999999999999; productType = "com.apple.product-type.application"; };
          666666666666666666666666 = { isa = XCBuildConfiguration; buildSettings = { CODE_SIGNING_ALLOWED = NO; INFOPLIST_FILE = FreshApp/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 16.0; LD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks"; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.final; PRODUCT_NAME = "$(TARGET_NAME)"; SWIFT_EMBED_LIBRARIES = YES; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Debug; };
          777777777777777777777777 = { isa = XCBuildConfiguration; buildSettings = { CODE_SIGNING_ALLOWED = NO; INFOPLIST_FILE = FreshApp/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 16.0; LD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks"; PRODUCT_BUNDLE_IDENTIFIER = com.uhri.final; PRODUCT_NAME = "$(TARGET_NAME)"; SWIFT_EMBED_LIBRARIES = YES; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
          888888888888888888888888 = { isa = PBXGroup; children = ( DDDDDDDDDDDDDDDDDDDDDDDD, EEEEEEEEEEEEEEEEEEEEEEEE ); path = FreshApp; sourceTree = "<group>"; };
          999999999999999999999999 = { isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = FreshApp.app; sourceTree = BUILT_PRODUCTS_DIR; };
          AAAAAAAAAAAAAAAAAAAAAAAA = { isa = XCConfigurationList; buildConfigurations = ( FFFFFFFFFFFFFFFFFFFF0001, FFFFFFFFFFFFFFFFFFFF0002 ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          BBBBBBBBBBBBBBBBBBBBBBBB = { isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = ( 111122223333444455556666 ); runOnlyForDeploymentPostprocessing = 0; };
          CCCCCCCCCCCCCCCCCCCCCCCC = { isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
          DDDDDDDDDDDDDDDDDDDDDDDD = { isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = FreshApp.swift; sourceTree = "<group>"; };
          EEEEEEEEEEEEEEEEEEEEEEEE = { isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          FFFFFFFFFFFFFFFFFFFF0001 = { isa = XCBuildConfiguration; buildSettings = { CODE_SIGNING_ALLOWED = NO; PRODUCT_NAME = "$(TARGET_NAME)"; }; name = Debug; };
          FFFFFFFFFFFFFFFFFFFF0002 = { isa = XCBuildConfiguration; buildSettings = { CODE_SIGNING_ALLOWED = NO; PRODUCT_NAME = "$(TARGET_NAME)"; }; name = Release; };
          111122223333444455556666 = { isa = PBXBuildFile; fileRef = DDDDDDDDDDDDDDDDDDDDDDDD; };
          }; rootObject = 111111111111111111111111; }
          PBX
          
          cat > FreshApp/FreshApp/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.uhri.final</string><key>CFBundleName</key><string>UHRI</string><key>CFBundleVersion</key><string>1.0</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleExecutable</key><string>FreshApp</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>
          PLIST
          
          ls -R FreshApp
          
          echo "Building..."
          cd FreshApp
          xcodebuild -project FreshApp.xcodeproj -target FreshApp -configuration Release archive -archivePath ../build/FreshApp.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SKIP_INSTALL=NO -destination 'generic/platform=iOS'
          BUILD_RESULT=$?
          echo "Build result: $BUILD_RESULT"
          cd ..
          ls -lh build/
          ls -lh build/FreshApp.xcarchive/ || true
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "App: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p build/ipa/Payload
            rm -rf build/ipa/Payload/*
            cp -R "$APP_PATH" build/ipa/Payload/
            cd build/ipa && zip -r UHRI-FINAL-WINNER.ipa Payload && cd ../..
            echo "=== SUCCESS - IPA CREATED ==="
            ls -lh build/ipa/
          else
            echo "=== Trying alternative build method ==="
            cd FreshApp
            xcodebuild -project FreshApp.xcodeproj -target FreshApp -configuration Release build CODE_SIGNING_ALLOWED=NO -destination 'generic/platform=iOS' SYMROOT=../build
            cd ..
            find build -name "*.app" -type d
            APP_PATH=$(find build -name "*.app" -type d | head -1)
            if [ -n "$APP_PATH" ]; then
              mkdir -p build/ipa/Payload
              cp -R "$APP_PATH" build/ipa/Payload/
              cd build/ipa && zip -r UHRI-FINAL-WINNER.ipa Payload && cd ../..
              echo "=== SUCCESS SECOND TRY ==="
            fi
          fi
    artifacts:
      - build/FreshApp.xcarchive
      - build/**/FreshApp.app
      - build/ipa/*.ipa
      - build/**/*.app
